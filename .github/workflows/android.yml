name: Build Android APK

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Create Android project
    run: |
      mkdir -p app/src/main/assets app/src/main/java/com/assassin/hunt
      cp assassin_hunt_v06_android_fix.html app/src/main/assets/index.html
      cat > settings.gradle <<'EOF'
      pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
      dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
      rootProject.name = 'AssassinHunt'
      include ':app'
      EOF
      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.6.1' apply false
      }
      EOF
      cat > app/build.gradle <<'EOF'
      plugins { id 'com.android.application' }
      android {
          namespace 'com.assassin.hunt'
          compileSdk 35
          defaultConfig {
              applicationId 'com.assassin.hunt'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
          }
      }
      EOF
      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <application android:theme="@android:style/Theme.Material.NoActionBar" android:label="ASSASSIN HUNT" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:screenOrientation="landscape" android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF
      cat > app/src/main/java/com/assassin/hunt/MainActivity.java <<'EOF'
      package com.assassin.hunt;
      import android.app.Activity;
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebSettings;
      public class MainActivity extends Activity {
          @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              setContentView(w);
              w.loadUrl("file:///android_asset/index.html");
          }
      }
      EOF
      echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" > gradle.properties

  - name: Build APK
    run: |
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AssassinHunt-APK
      path: app/build/outputs/apk/debug/app-debug.apk
